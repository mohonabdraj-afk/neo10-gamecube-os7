name: Build Game_Cube_Unlock_Neo10_OS7 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify signing keystore
        run: |
          if [ ! -f app/keystore.jks ]; then
            keytool -genkeypair -v -keystore app/keystore.jks -storepass neo10os7pass -keypass neo10os7pass -alias neo10os7 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Neo10OS7, OU=GameCube, O=CleanModule"
          fi

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare Output APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Game_Cube_Unlock_Neo10_OS7.apk
          ls -lh out/Game_Cube_Unlock_Neo10_OS7.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game_Cube_Unlock_Neo10_OS7_APK
          path: out/Game_Cube_Unlock_Neo10_OS7.apk
          if-no-files-found: error
